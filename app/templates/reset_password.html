<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AttendMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #dash-canvas {
            z-index: 1;
        }

        #wave-canvas {
            z-index: 2;
        }

        /* ── Card centered ── */
        .card-wrap {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            pointer-events: none;
        }

        .rp-card {
            pointer-events: auto;
            width: 440px;
            max-width: 95vw;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(233, 30, 140, 0.20);
            padding: 2.4rem;
            box-shadow: 0 8px 40px rgba(233, 30, 140, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
            animation: cardIn .55s cubic-bezier(.23, 1, .32, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* stripe */
        .card-stripe {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #e91e8c, #ff4db8, transparent);
            border-radius: 24px 24px 0 0;
            animation: stripe 3s ease-in-out infinite;
        }

        @keyframes stripe {

            0%,
            100% {
                opacity: .3
            }

            50% {
                opacity: 1
            }
        }

        /* Logo */
        .logo-box {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #00c8ff, #007bff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            color: #fff;
            margin: 0 auto 1.2rem;
            box-shadow: 0 0 28px rgba(0, 200, 255, .32);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow: 0 0 18px rgba(0, 200, 255, .3)
            }

            50% {
                box-shadow: 0 0 36px rgba(0, 200, 255, .55)
            }
        }

        .rp-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .rp-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -.4px;
            background: linear-gradient(135deg, #1a1a2e 30%, #007bff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rp-sub {
            color: #888;
            font-size: .83rem;
            margin-top: .25rem;
        }

        /* Alerts */
        .flash {
            display: flex;
            align-items: center;
            gap: .55rem;
            padding: .65rem .9rem;
            border-radius: 10px;
            font-size: .84rem;
            margin-bottom: .9rem;
        }

        .flash-danger {
            background: rgba(233, 30, 140, .07);
            color: #c2185b;
            border: 1px solid rgba(233, 30, 140, .2);
        }

        .flash-success {
            background: rgba(0, 151, 90, .07);
            color: #007a4d;
            border: 1px solid rgba(0, 151, 90, .2);
        }

        /* Form */
        .f-group {
            margin-bottom: 1.2rem;
        }

        .f-label {
            display: block;
            font-size: .71rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .75px;
            color: #555;
            margin-bottom: .32rem;
        }

        .f-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .f-icon {
            position: absolute;
            left: .85rem;
            color: #007bff;
            font-size: .82rem;
        }

        .f-input {
            width: 100%;
            padding: .62rem 2.8rem .62rem 2.4rem;
            background: rgba(255, 255, 255, .92);
            border: 1.5px solid rgba(0, 123, 255, .18);
            border-radius: 10px;
            color: #1a1a2e;
            font-size: .875rem;
            font-family: inherit;
            transition: all .2s;
        }

        .f-input::placeholder {
            color: #bbb;
        }

        .f-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, .10);
        }

        .btn-go {
            width: 100%;
            padding: .85rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #007bff, #00c8ff);
            color: #fff;
            font-size: .93rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            box-shadow: 0 4px 18px rgba(0, 123, 255, .28);
            transition: all .2s;
        }

        .btn-go:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 123, 255, .38);
        }

        .btn-go:active {
            transform: scale(.98);
        }

        .pwd-toggle {
            position: absolute;
            right: .75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #bbb;
            transition: color .2s;
            font-size: .9rem;
        }

        .pwd-toggle:hover {
            color: #007bff;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: .81rem;
            color: #888;
        }

        .back-link a {
            color: #e91e8c;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Strength indicator */
        .strength-row {
            margin-top: 0.5rem;
        }

        .strength-meter {
            height: 4px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .strength-txt {
            font-size: 0.72rem;
            margin-top: 0.25rem;
            min-height: 1.2em;
        }
    </style>
</head>

<body>
    <canvas id="dash-canvas"></canvas>
    <canvas id="wave-canvas"></canvas>

    <div class="card-wrap">
        <div class="rp-card" style="position:relative;">
            <div class="card-stripe"></div>

            <div class="rp-header">
                <div class="logo-box"><i class="fas fa-shield-alt"></i></div>
                <h1 class="rp-title">Reset Password</h1>
                <p class="rp-sub">Setting new password for <strong style="color:#e91e8c;">{{ username }}</strong></p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for cat, msg in messages %}
            <div class="flash flash-{{ cat }}">
                <i
                    class="fas fa-{% if cat == 'success' %}check-circle{% elif cat == 'danger' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
                {{ msg }}
            </div>
            {% endfor %}{% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" id="resetForm">
                <div class="f-group">
                    <label class="f-label">New Password</label>
                    <div class="f-wrap">
                        <i class="fas fa-lock f-icon"></i>
                        <input type="password" name="password" id="newPwd" class="f-input"
                            placeholder="At least 6 characters" required minlength="6" autofocus>
                        <button type="button" class="pwd-toggle" onclick="togglePwd('newPwd','icon1')">
                            <i class="fas fa-eye" id="icon1"></i>
                        </button>
                    </div>
                </div>

                <div class="f-group">
                    <label class="f-label">Confirm Password</label>
                    <div class="f-wrap">
                        <i class="fas fa-lock-open f-icon"></i>
                        <input type="password" name="confirm" id="confirmPwd" class="f-input"
                            placeholder="Repeat new password" required>
                        <button type="button" class="pwd-toggle" onclick="togglePwd('confirmPwd','icon2')">
                            <i class="fas fa-eye" id="icon2"></i>
                        </button>
                    </div>
                    <p id="matchMsg" style="font-size:0.75rem; margin-top:0.3rem; min-height:1em;"></p>
                </div>

                <div class="strength-row">
                    <div class="strength-meter">
                        <div id="strengthBar" class="strength-bar"></div>
                    </div>
                    <p id="strengthTxt" class="strength-txt"></p>
                </div>

                <button type="submit" class="btn-go" style="margin-top:1rem">
                    <i class="fas fa-check-circle"></i>
                    Reset Password
                </button>
            </form>

            <div class="back-link">
                <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        /* ═══ CANVAS SETUP ═══ */
        var dc = document.getElementById('dash-canvas');
        var dctx = dc.getContext('2d');
        var wc = document.getElementById('wave-canvas');
        var wctx = wc.getContext('2d');
        var W = 0, H = 0;
        var mouse = { x: -9999, y: -9999, rx: -9999, ry: -9999 };

        window.addEventListener('mousemove', function (e) { mouse.rx = e.clientX; mouse.ry = e.clientY; });
        function resize() {
            W = dc.width = wc.width = window.innerWidth;
            H = dc.height = wc.height = window.innerHeight;
        }
        window.addEventListener('resize', function () { resize(); spawnDashes(); });

        /* ═══ RAINBOW ═══ */
        var PAL = [
            [66, 133, 244], [103, 78, 244], [156, 39, 176],
            [233, 30, 140], [229, 57, 53], [255, 111, 10]
        ];
        function rainbow(yFrac) {
            var t = Math.max(0, Math.min(1, yFrac)) * (PAL.length - 1);
            var lo = Math.floor(t), hi = Math.min(lo + 1, PAL.length - 1), f = t - lo;
            return [(PAL[lo][0] + (PAL[hi][0] - PAL[lo][0]) * f) | 0,
            (PAL[lo][1] + (PAL[hi][1] - PAL[lo][1]) * f) | 0,
            (PAL[lo][2] + (PAL[hi][2] - PAL[lo][2]) * f) | 0];
        }

        /* ═══ DASHES ═══ */
        var dashes = [];
        function makeDash(sy) {
            return {
                x: Math.random() * W, y: sy !== undefined ? sy : H + Math.random() * 80,
                vx: (Math.random() - .5) * .28, vy: -(Math.random() * .5 + .18),
                w: Math.random() * 18 + 8, h: Math.random() * 3 + 2,
                angle: Math.random() * Math.PI, spin: (Math.random() - .5) * .016,
                alpha: Math.random() * .45 + .28
            };
        }
        function spawnDashes() {
            var n = Math.min(Math.floor(W * H / 9000), 140);
            dashes = [];
            for (var i = 0; i < n; i++) dashes.push(makeDash(Math.random() * H));
        }
        function updateDash(d) {
            d.x += d.vx; d.y += d.vy; d.angle += d.spin;
            var dx = d.x - mouse.x, dy = d.y - mouse.y, d2 = dx * dx + dy * dy;
            if (d2 < 14400) { var dist = Math.sqrt(d2), f = (120 - dist) / 120 * 2.0; d.x += dx / dist * f; d.y += dy / dist * f; }
            if (d.y < -30) { d.x = Math.random() * W; d.y = H + 20; }
            if (d.x < -40) d.x = W + 40; if (d.x > W + 40) d.x = -40;
        }
        function drawDash(d) {
            var col = rainbow(d.y / H);
            dctx.save(); dctx.translate(d.x, d.y); dctx.rotate(d.angle);
            dctx.beginPath(); dctx.ellipse(0, 0, d.w / 2, d.h / 2, 0, 0, Math.PI * 2);
            dctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + d.alpha + ')';
            dctx.fill(); dctx.restore();
        }

        /* ═══ WAVES ═══ */
        var WAVES = [
            { r: 233, g: 30, b: 140, a: .10, spd: .012, amp: 48, frq: .009, yo: .80 },
            { r: 191, g: 80, b: 255, a: .07, spd: .019, amp: 34, frq: .014, yo: .84 },
            { r: 255, g: 80, b: 200, a: .09, spd: .008, amp: 56, frq: .007, yo: .88 },
            { r: 66, g: 133, b: 244, a: .06, spd: .023, amp: 24, frq: .019, yo: .76 }
        ];
        var tick = 0;
        function drawWaves() {
            wctx.clearRect(0, 0, W, H);
            var mx = mouse.x < 0 ? 0 : mouse.x / W * 2 - 1;
            var my = mouse.y < 0 ? 0 : mouse.y / H * 2 - 1;
            for (var i = 0; i < WAVES.length; i++) {
                var w = WAVES[i], by = H * w.yo, amp = w.amp * (1 + my * .5), frq = w.frq * (1 + mx * .3), ph = mx * 1.6;
                wctx.beginPath(); wctx.moveTo(0, H);
                for (var x = 0; x <= W; x += 2) {
                    var t = tick * w.spd + x * frq + ph;
                    var md = Math.abs(x - mouse.x) / W;
                    var rip = mouse.x > 0 ? (1 - md) * 14 * Math.sin((x - mouse.x) * .04 + tick * .06) : 0;
                    wctx.lineTo(x, by + Math.sin(t) * amp + Math.sin(t * 1.6 + i) * amp * .28 + rip);
                }
                wctx.lineTo(W, H); wctx.closePath();
                var gr = wctx.createLinearGradient(0, by - amp, 0, H);
                gr.addColorStop(0, 'rgba(' + w.r + ',' + w.g + ',' + w.b + ',' + w.a + ')');
                gr.addColorStop(1, 'rgba(' + w.r + ',' + w.g + ',' + w.b + ',0)');
                wctx.fillStyle = gr; wctx.fill();
                wctx.beginPath();
                for (var x = 0; x <= W; x += 2) {
                    var t = tick * w.spd + x * frq + ph;
                    var md = Math.abs(x - mouse.x) / W;
                    var rip = mouse.x > 0 ? (1 - md) * 14 * Math.sin((x - mouse.x) * .04 + tick * .06) : 0;
                    var y = by + Math.sin(t) * amp + Math.sin(t * 1.6 + i) * amp * .28 + rip;
                    if (x === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
                }
                wctx.strokeStyle = 'rgba(' + w.r + ',' + w.g + ',' + w.b + ',' + Math.min(w.a * 3.5, .65) + ')';
                wctx.lineWidth = 1.5; wctx.stroke();
            }
        }

        /* ═══ LOOP ═══ */
        function loop() {
            mouse.x += (mouse.rx - mouse.x) * .08; mouse.y += (mouse.ry - mouse.y) * .08;
            tick++;
            dctx.clearRect(0, 0, W, H);
            for (var i = 0; i < dashes.length; i++) { updateDash(dashes[i]); drawDash(dashes[i]); }
            drawWaves();
            requestAnimationFrame(loop);
        }

        resize(); spawnDashes(); loop();

        /* ═══ FORM HELPERS ═══ */
        function togglePwd(id, iconId) {
            var f = document.getElementById(id);
            var i = document.getElementById(iconId);
            f.type = f.type === 'password' ? 'text' : 'password';
            i.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        }

        var newPwd = document.getElementById('newPwd');
        var confirmPwd = document.getElementById('confirmPwd');
        var matchMsg = document.getElementById('matchMsg');
        var bar = document.getElementById('strengthBar');
        var txt = document.getElementById('strengthTxt');

        function checkStrength(p) {
            var s = 0;
            if (p.length >= 6) s++;
            if (p.length >= 10) s++;
            if (/[A-Z]/.test(p)) s++;
            if (/[0-9]/.test(p)) s++;
            if (/[^A-Za-z0-9]/.test(p)) s++;
            var levels = [
                [0, '0%', '', ''],
                [1, '20%', '#d32f2f', 'Weak'],
                [2, '40%', '#f59e0b', 'Fair'],
                [3, '60%', '#f59e0b', 'Good'],
                [4, '80%', '#00975a', 'Strong'],
                [5, '100%', '#00975a', 'Very Strong']
            ];
            var l = levels[Math.min(s, 5)];
            bar.style.width = l[1]; bar.style.background = l[2];
            txt.textContent = l[3] ? "Strength: " + l[3] : "";
            txt.style.color = l[2] || "#888";
        }

        newPwd.addEventListener('input', function () { checkStrength(newPwd.value); });
        confirmPwd.addEventListener('input', function () {
            if (!confirmPwd.value) { matchMsg.textContent = ''; return; }
            if (newPwd.value === confirmPwd.value) {
                matchMsg.textContent = '✓ Passwords match'; matchMsg.style.color = '#00975a';
            } else {
                matchMsg.textContent = '✗ Passwords do not match'; matchMsg.style.color = '#d32f2f';
            }
        });

        document.getElementById('resetForm').addEventListener('submit', function (e) {
            if (newPwd.value !== confirmPwd.value) {
                e.preventDefault();
                matchMsg.textContent = '✗ Passwords do not match'; matchMsg.style.color = '#d32f2f';
            }
        });
    </script>
</body>

</html>
